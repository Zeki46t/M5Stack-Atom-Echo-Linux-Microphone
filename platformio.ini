[env:atom-echo]
platform = espressif32@6.9.0
board = m5stack-atom
framework = espidf
upload_speed = 115200
; The firmware streams binary audio frames on the USB serial port at this
; baud rate, so the PlatformIO monitor will show garbage. Use it only to spot
; the boot/Bluetooth log lines between frames.
monitor_speed = 500000
board_build.partitions = partitions.csv
